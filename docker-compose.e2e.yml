# E2E (P30) uchun ALOHIDA, bir martalik stek — `docs/12` 8-bo'lim.
#
# NEGA ALOHIDA FAYL VA ALOHIDA LOYIHA NOMI:
# jonli stek (`docker-compose.yml`, loyiha nomi `16shaxsiyat`) `16shaxsiyat.uz` domenida
# HAQIQIY maktab va o'quvchi ma'lumotlari bilan ishlaydi. E2E testlar maktab yaratadi,
# o'quvchi ro'yxatdan o'tkazadi va o'chiradi — bu jonli bazada bajarilishi MUMKIN EMAS.
# Shu sabab bu yerda hamma narsa ajratilgan:
#   * loyiha nomi   — `shaxsiyat-e2e` (konteyner nomlari to'qnashmaydi)
#   * volume        — `e2e_pgdata` (har run boshida `down -v` bilan tozalanadi)
#   * baza          — `studentroadmap_e2e`, alohida foydalanuvchi va parol
#   * port          — API `127.0.0.1:${E2E_API_PORT:-5081}` (jonli stek portlariga tegmaydi)
#   * tunnel YO'Q   — tashqi dunyoga chiqmaydi
#
# Ishga tushirish/to'xtatish odatda QO'LDA kerak emas: `frontend/e2e/support/stack.ts`
# (Playwright `globalSetup`) buni o'zi qiladi. Qo'lda:
#   docker compose -f docker-compose.e2e.yml -p shaxsiyat-e2e up -d
#   docker compose -f docker-compose.e2e.yml -p shaxsiyat-e2e down -v
name: shaxsiyat-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap_e2e
      POSTGRES_USER: srm_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?E2E_DB_PASSWORD kerak — globalSetup uni har run uchun tasodifiy generatsiya qiladi}
    # Host'ga port CHIQARILMAYDI — bazaga faqat compose tarmog'i ichidan murojaat qilinadi.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U srm_e2e -d studentroadmap_e2e']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: shaxsiyat-e2e-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ['--migrate']
    environment: &api_env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: 'Host=db;Port=5432;Database=studentroadmap_e2e;Username=srm_e2e;Password=${E2E_DB_PASSWORD:?E2E_DB_PASSWORD kerak}'
      Jwt__Key: ${E2E_JWT_KEY:?E2E_JWT_KEY kerak — globalSetup har run uchun tasodifiy generatsiya qiladi}
      Security__EncryptionKey: ${E2E_ENCRYPTION_KEY:?E2E_ENCRYPTION_KEY kerak — globalSetup har run uchun tasodifiy generatsiya qiladi}
      Security__IpHashSalt: ${E2E_IP_HASH_SALT:-}
      App__FrontendUrl: ${E2E_FRONTEND_URL:-http://127.0.0.1:5199}
      App__SeedOnStartup: 'false'
      # DIQQAT — FAQAT E2E UCHUN. `X-Forwarded-For` ga ishoniladi, chunki testlar har bir
      # brauzer konteksti uchun boshqa "mijoz IP" yuboradi. Usiz `POST /api/public/sessions`
      # ning IP bo'yicha limiti (soatiga 10 ta, `RateLimitSetup.PublicStartSession`) butun
      # to'plamni bir necha o'quvchidan keyin `429` bilan to'xtatib qo'yardi va testlar
      # ketma-ket 3 marta ishlay olmasdi. Bu stek faqat `127.0.0.1` da, bir martalik bazada
      # va bir martalik kalitlar bilan ishlaydi — jonli konfiguratsiyaga TA'SIR QILMAYDI.
      App__KnownProxies: 0.0.0.0/0
      ADMIN_USERNAME: ${E2E_ADMIN_USERNAME:?E2E_ADMIN_USERNAME kerak — .env.example ga qarang}
      ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?E2E_ADMIN_PASSWORD kerak — .env.example ga qarang}
      ADMIN_EMAIL: e2e@example.invalid
      # AI provayder kaliti ATAYLAB berilmaydi — E2E'da haqiqiy AI chaqiruvi bo'lmaydi
      # (`prompts/30` 5-band). Tahlil navbati shablon hisobotga tushadi.
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  seed:
    image: shaxsiyat-e2e-api:latest
    command: ['--seed']
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    image: shaxsiyat-e2e-api:latest
    environment: *api_env
    ports:
      - '127.0.0.1:${E2E_API_PORT:-5081}:8080'
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: 'no'
