# Docker Compose loyiha nomi — konteynerlar `16shaxsiyat-*` prefiksi bilan ataladi.
# (Repo/solution nomi `StudentRoadMap` bo'lib qoladi — u ichki kod nomi, `CLAUDE.md` Brend bo'limi.)
name: 16shaxsiyat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d studentroadmap"]
      interval: 10s
      retries: 5

  # --- Namoyish/sinov uchun (P32 gacha vaqtinchalik) --------------------------------
  # `app` va `tunnel` faqat `--profile tunnel` bilan ko'tariladi, shuning uchun
  # oddiy `docker compose up -d` faqat bazani ishga tushiradi.
  #
  # Hozircha API (`dotnet run`) va frontend (`npm run dev`) HOST da ishlaydi, shuning
  # uchun `app` ular tomon `host.docker.internal` orqali proksilaydi. P32 da
  # `Dockerfile.api`/`Dockerfile.web` tayyor bo'lgach bu ikkisi haqiqiy servislarga
  # almashadi va `host.docker.internal` keraksiz bo'ladi.
  app:
    image: nginx:alpine
    profiles: [tunnel]
    volumes:
      - ./docker/app-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Cloudflare tunnel — ilovani ommaviy domenga chiqaradi.
  # Token SIR: faqat `.env` da (`TUNNEL_TOKEN`), repoga tushmaydi (CLAUDE.md 4-qoida).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN .env faylida berilishi shart}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
