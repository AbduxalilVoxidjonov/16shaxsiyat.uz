services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d studentroadmap"]
      interval: 10s
      retries: 5

# `api`/`web` servislari keyingi promptlarda (Dockerfile.api/Dockerfile.web tayyor bo'lgach,
# `docs/13-deploy-va-infratuzilma.md` 2-bo'limiga mos) qo'shiladi.

volumes:
  pgdata:
