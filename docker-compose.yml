# Docker Compose loyiha nomi — konteynerlar `16shaxsiyat-*` prefiksi bilan ataladi.
# (Repo/solution nomi `StudentRoadMap` bo'lib qoladi — u ichki kod nomi, `CLAUDE.md` Brend bo'limi.)
name: 16shaxsiyat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d studentroadmap"]
      interval: 10s
      retries: 5

  # --- Ilova (P32) ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Konteyner ichida baza `db` xosti orqali ko'rinadi (host'dagi `localhost` emas).
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=studentroadmap;Username=srm;Password=${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}"
      Jwt__Key: ${Jwt__Key:?Jwt__Key .env faylida berilishi shart}
      Security__EncryptionKey: ${Security__EncryptionKey:?Security__EncryptionKey .env faylida berilishi shart}
      Security__IpHashSalt: ${Security__IpHashSalt:-}
      # `app` konteyneri ishonchli proksi — usiz X-Forwarded-For e'tiborsiz qoladi va
      # rate limiting hamda IP audit bitta manzilga yig'ilib qoladi (P10 QA topilmasi).
      App__KnownProxies: ${App__KnownProxies:-}
      App__FrontendUrl: ${App__FrontendUrl:-http://localhost:8080}
      App__SeedOnStartup: ${App__SeedOnStartup:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (qurilgan statik fayllar) + `/api` proksisi — bitta origin.
  # Nomi `app`: Cloudflare tunnel konfiguratsiyasi `http://app:8080` ga qaraydi.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  # Cloudflare tunnel — faqat `--profile tunnel` bilan ko'tariladi.
  # Token SIR: faqat `.env` da (`TUNNEL_TOKEN`), repoga tushmaydi (CLAUDE.md 4-qoida).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN .env faylida berilishi shart}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
