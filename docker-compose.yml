# Docker Compose loyiha nomi — konteynerlar `16shaxsiyat-*` prefiksi bilan ataladi.
# (Repo/solution nomi `StudentRoadMap` bo'lib qoladi — u ichki kod nomi, `CLAUDE.md` Brend bo'limi.)
name: 16shaxsiyat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    ports:
      # FAQAT lokal interfeys — baza tashqi tarmoqdan ko'rinmaydi. Konteynerlar bir-birini
      # compose tarmog'i orqali (`Host=db`) topadi, port chiqarish faqat host'dan `psql`
      # bilan ulanish uchun kerak. `0.0.0.0` da ochiq qoldirish bir xil Wi-Fi'dagi
      # istalgan qurilmaga bazaga urinish imkonini berardi.
      #
      # Standart **5433**, 5432 EMAS: shu mashinada boshqa loyihaning Postgres'i 5432 ni
      # egallab turgani aniqlandi va butun stek "port is already allocated" bilan ko'tarilmay
      # qolgan edi. Boshqa port kerak bo'lsa `.env` da `DB_PORT` bilan o'zgartiriladi.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d studentroadmap"]
      interval: 10s
      retries: 5

  # --- Ilova (P32) ------------------------------------------------------------------
  # Migratsiya ALOHIDA bir martalik konteyner (`docs/05` 4-bo'lim 5-band: ilova
  # ichida avtomatik `Database.Migrate()` chaqirilmaydi). Bajarilib to'xtaydi;
  # `api` uning muvaffaqiyatli tugashini kutadi.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["--migrate"]
    environment: &api_env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=studentroadmap;Username=srm;Password=${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}"
      Jwt__Key: ${Jwt__Key:?Jwt__Key .env faylida berilishi shart}
      Security__EncryptionKey: ${Security__EncryptionKey:?Security__EncryptionKey .env faylida berilishi shart}
      Security__IpHashSalt: ${Security__IpHashSalt:-}
      App__KnownProxies: ${App__KnownProxies:-}
      App__FrontendUrl: ${App__FrontendUrl:-http://localhost:8080}
      App__SeedOnStartup: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Katalog seed'i (190 savol, 16 tip, kasb xaritasi, superadmin) — idempotent.
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["--seed"]
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment: *api_env
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Frontend (qurilgan statik fayllar) + `/api` proksisi — bitta origin.
  # Nomi `app`: Cloudflare tunnel konfiguratsiyasi `http://app:8080` ga qaraydi.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    # Host'ga port CHIQARILMAYDI — ilova faqat Cloudflare tunnel orqali, o'z domenida
    # ochiladi. Shu sababli mashinada hech narsa tinglamaydi (ortiqcha hujum yuzasi yo'q).
    # Lokal tekshiruv kerak bo'lsa vaqtincha:  docker compose port app 8080
    # yoki quyidagini yoqing:
    #   ports:
    #     - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  # Cloudflare tunnel — `docker compose up -d --build` bilan birga ko'tariladi.
  # Token SIR: faqat `.env` da (`TUNNEL_TOKEN`), repoga tushmaydi (CLAUDE.md 4-qoida).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN .env faylida berilishi shart}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:

# Tarmoq subneti QAT'IY belgilangan (172.26.0.0/16 — joriy production bilan bir xil,
# `docker network inspect 16shaxsiyat_default` bilan tasdiqlangan). Sabab: `App__KnownProxies`
# (.env) shu subnetga tayanadi — agar tarmoq qayta yaratilganda Docker'ning avtomatik
# tanlagan subneti o'zgarib qolsa, `ForwardedHeadersSetup` `X-Forwarded-For`/`X-Forwarded-Proto`
# header'iga ISHONMAY QO'YADI va bu JIMGINA sodir bo'ladi (xato chiqmaydi) — natijada rate
# limiting va IP audit barcha so'rovlarni bitta (proksi) manzilga yig'ib qo'yadi
# (`docs/13` MAXSUS DIQQAT, P10 QA topilmasi). Subnet shu yerda qotirilgani uchun
# `docker compose down && up` tarmoqni qayta yaratsa ham qiymat o'zgarmaydi.
networks:
  default:
    ipam:
      config:
        - subnet: 172.26.0.0/16
