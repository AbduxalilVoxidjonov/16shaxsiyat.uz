# Docker Compose loyiha nomi — konteynerlar `16shaxsiyat-*` prefiksi bilan ataladi.
# (Repo/solution nomi `StudentRoadMap` bo'lib qoladi — u ichki kod nomi, `CLAUDE.md` Brend bo'limi.)
name: 16shaxsiyat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentroadmap
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    ports:
      # FAQAT lokal interfeys — baza tashqi tarmoqdan ko'rinmaydi. Konteynerlar bir-birini
      # compose tarmog'i orqali (`Host=db`) topadi, port chiqarish faqat host'dan `psql`
      # bilan ulanish uchun kerak. `0.0.0.0` da ochiq qoldirish bir xil Wi-Fi'dagi
      # istalgan qurilmaga bazaga urinish imkonini berardi.
      #
      # Standart **5433**, 5432 EMAS: shu mashinada boshqa loyihaning Postgres'i 5432 ni
      # egallab turgani aniqlandi va butun stek "port is already allocated" bilan ko'tarilmay
      # qolgan edi. Boshqa port kerak bo'lsa `.env` da `DB_PORT` bilan o'zgartiriladi.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d studentroadmap"]
      interval: 10s
      retries: 5

  # --- Ilova (P32) ------------------------------------------------------------------
  # Migratsiya ALOHIDA bir martalik konteyner (`docs/05` 4-bo'lim 5-band: ilova
  # ichida avtomatik `Database.Migrate()` chaqirilmaydi). Bajarilib to'xtaydi;
  # `api` uning muvaffaqiyatli tugashini kutadi.
  migrate:
    # Obraz `api` xizmatida bir marta quriladi (`image: 16shaxsiyat-api`) — bu yerda
    # `build:` YO'Q. Ilgari `migrate`, `seed` va `api` uchchalasi ham AYNAN bir xil
    # `docker/Dockerfile.api` dan uch alohida obraz qurar edi: `up --build` da uch marta
    # ortiqcha qurish ketardi. Endi bitta obraz uch xizmatda qayta ishlatiladi.
    image: 16shaxsiyat-api
    command: ["--migrate"]
    environment: &api_env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=studentroadmap;Username=srm;Password=${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}"
      Jwt__Key: ${Jwt__Key:?Jwt__Key .env faylida berilishi shart}
      Security__EncryptionKey: ${Security__EncryptionKey:?Security__EncryptionKey .env faylida berilishi shart}
      Security__IpHashSalt: ${Security__IpHashSalt:-}
      # Telegram Login Widget imzosini tekshirish uchun bot tokeni (P47). BO'SH bo'lsa
      # Telegram kirishi o'chiq (`503 TELEGRAM_AUTH_NOT_CONFIGURED`), qolgan oqimlar ishlaydi
      # — shu sabab `:?` (majburiy) EMAS, `:-` (ixtiyoriy) ishlatilgan.
      Telegram__BotToken: ${Telegram__BotToken:-}
      # Natijani foydalanuvchiga ko'rsatish — GLOBAL kill-switch, standart `true` (P47).
      # Haqiqiy qaror makon darajasida (`schools.show_result_to_student`).
      App__ShowResultToStudent: ${App__ShowResultToStudent:-true}
      # Ishonchli proksi subneti — pastdagi `networks.default` bilan BIR XIL (`docs/13` §7).
      # Standart `COMPOSE_SUBNET` (tarmoq subneti bilan AYNAN bitta o'zgaruvchi): `.env` da qator unutilsa ham production zanjiri (cloudflared →
      # nginx → api) haqiqiy mijoz IP'sini beradi. Faqat docker ichki tarmog'i, tashqi manzil
      # emas — spoofing himoyasi saqlanadi (`ForwardedHeadersSetup`).
      App__KnownProxies: ${App__KnownProxies:-${COMPOSE_SUBNET:-172.26.0.0/16}}
      # Maktab havolalari (`{FrontendUrl}/t/{slug}?k=...`) va CORS origin'i. Standart —
      # production domeni (2026-09-23: serverga ko'chirish). Ilgari `http://localhost:8080`
      # edi: `.env` da qator unutilsa, admin paneldan nusxalangan havolalar o'quvchiga
      # ochilmaydigan localhost manzilni ko'rsatardi. Lokal sinovda `.env` da bering.
      App__FrontendUrl: ${App__FrontendUrl:-https://16shaxsiyat.uz}
      App__SeedOnStartup: "false"
      # AI tahlilini o'quvchi sessiyani yakunlashi bilan AVTOMATIK navbatga qo'yish.
      # Standart `false` (2026-09-03 egasi qarori, `docs/06` 8-bo'lim): har tahlil AI
      # xarajati, shu sabab tahlil admin panelidagi "AI tahlil qilish" tugmasi bilan
      # QO'LDA ishga tushiriladi. Yoqish uchun `.env` da `Ai__AutoAnalyzeOnCompletion=true`.
      Ai__AutoAnalyzeOnCompletion: ${Ai__AutoAnalyzeOnCompletion:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Katalog seed'i (190 savol, 16 tip, kasb xaritasi, superadmin) — idempotent, LEKIN
  # ma'lumot bir marta yozilgach har `up` da qayta yugurishi shart emas (egasining
  # 2026-09-05 qarori: "bir marta qo'shilib bo'lganlari endi kerak emas").
  #
  # Shu sabab `profiles: [init]` — ODATIY `docker compose up -d` uni ISHGA TUSHIRMAYDI.
  # Seed kerak bo'lganda (bo'sh baza, yangi savol banki, yangi tip katalogi):
  #     docker compose --profile init run --rm seed
  #
  # `migrate` esa ATAYLAB profil ostiga OLINMADI: u sxemani `__EFMigrationsHistory` bilan
  # solishtiradi va yangilik bo'lmasa bir soniyada tugaydi, ya'ni "qayta yugurish"ning
  # narxi yo'q. Lekin uni o'tkazib yuborilsa xato JIMGINA yuzaga chiqadi — API sxema
  # eskirganini ishga tushishda tekshirmaydi (`Program.cs`), shunchaki keyinroq
  # "column does not exist" bilan yiqiladi. Avtomatik qolgani shuning uchun.
  seed:
    image: 16shaxsiyat-api
    command: ["--seed"]
    environment: *api_env
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # Aniq teg — `migrate` va `seed` xuddi shu obrazni qayta ishlatadi (yuqoridagi izoh).
    image: 16shaxsiyat-api
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Frontend (qurilgan statik fayllar) + `/api` proksisi — bitta origin.
  # Nomi `app`: Cloudflare tunnel konfiguratsiyasi `http://app:8080` ga qaraydi.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Telegram Login Widget bot nomi (`@`siz) — Vite uni BUILD vaqtida bundle'ga yozadi.
        # Ilgari faqat `frontend/.env` (gitignore'da) dan olinardi: `git clone` qilingan
        # serverda fayl yo'q → `/kirish` "Telegram kirishi sozlanmagan" deb chiqardi.
        # SIR EMAS (widget sahifada ochiq ko'rinadi). Server tomondagi juft sozlama —
        # `Telegram__BotToken` (sir, `.env` da).
        VITE_TELEGRAM_BOT: ${VITE_TELEGRAM_BOT:-shaxsiyat16_bot}
    depends_on:
      - api
    # Host porti FAQAT `127.0.0.1` ga bog'lanadi va FAQAT diagnostika uchun (masalan,
    # serverda `curl http://127.0.0.1:${WEB_PORT}/health`). Ommaviy trafik bu portdan
    # O'TMAYDI: Cloudflare ingress `http://app:8080` — bu docker ICHKI tarmog'idagi
    # konteyner porti, host portiga aloqasi yo'q. Shu sabab host portini istalgancha
    # o'zgartirish tunnelga ta'sir qilmaydi.
    # Standart 8090, 8080 EMAS: host'da 8080 boshqa servis bilan band bo'lishi mumkin
    # (Mac'da ham, serverda ham) — host'da hech narsa 8080 ga bog'lanmaydi. Boshqa port
    # kerak bo'lsa `.env` da `WEB_PORT=...`.
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    restart: unless-stopped

  # Cloudflare tunnel — `profiles: [tunnel]`: oddiy `docker compose up -d` uni KO'TARMAYDI,
  # production'da har doim profil bilan ishga tushiriladi (`docs/13` §13):
  #     docker compose --profile tunnel up -d
  # DIQQAT: tunnel remote-managed — bitta token bilan IKKI mashinada ishga tushirilsa
  # (masalan, eski lokal Mac + yangi server) Cloudflare trafikni ular orasida BO'LADI.
  # Token SIR: faqat `.env` da (`TUNNEL_TOKEN`), repoga tushmaydi (CLAUDE.md 4-qoida).
  # `:-` (majburiy emas): compose faylni o'qishdayoq interpolyatsiya qiladi, `:?` bo'lsa
  # profil o'chiq bo'lsa ham token yo'qligida butun stek ko'tarilmas edi.
  tunnel:
    image: cloudflare/cloudflared:latest
    # Token `--token` argumenti EMAS, muhit o'zgaruvchisi orqali (cloudflared `TUNNEL_TOKEN`
    # ni o'zi o'qiydi): argv host'dagi har qanday foydalanuvchiga `ps aux` da ko'rinadi.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:

# Tarmoq subneti QAT'IY belgilangan (172.26.0.0/16 — joriy production bilan bir xil,
# `docker network inspect 16shaxsiyat_default` bilan tasdiqlangan). Sabab: `App__KnownProxies`
# (.env) shu subnetga tayanadi — agar tarmoq qayta yaratilganda Docker'ning avtomatik
# tanlagan subneti o'zgarib qolsa, `ForwardedHeadersSetup` `X-Forwarded-For`/`X-Forwarded-Proto`
# header'iga ISHONMAY QO'YADI va bu JIMGINA sodir bo'ladi (xato chiqmaydi) — natijada rate
# limiting va IP audit barcha so'rovlarni bitta (proksi) manzilga yig'ib qo'yadi
# (`docs/13` MAXSUS DIQQAT, P10 QA topilmasi). Subnet shu yerda qotirilgani uchun
# `docker compose down && up` tarmoqni qayta yaratsa ham qiymat o'zgarmaydi.
networks:
  default:
    ipam:
      config:
        # Server'da bu subnet band bo'lsa (`docker network ls` / `ip route`) — `.env` da
        # `COMPOSE_SUBNET=172.30.0.0/16` kabi bo'sh diapazon bering; `App__KnownProxies`
        # (alohida berilmagan bo'lsa) avtomatik shu qiymatni oladi.
        - subnet: ${COMPOSE_SUBNET:-172.26.0.0/16}
