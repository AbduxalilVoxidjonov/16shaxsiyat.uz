# Telegram kirishining redirect callback'i (`/kirish`) uchun QUERY'SIZ log formati.
#
# Telegram foydalanuvchini `/kirish?id=…&first_name=…&username=…&photo_url=…&hash=…`
# ko'rinishida qaytaradi — ya'ni manzilning O'ZIDA shaxsiy ma'lumot bor. Standart
# `combined` formati `$request` ni yozadi, `$request` esa query bilan birga keladi:
# natijada ism va Telegram id `access.log` ga tushib, log rotatsiyasi/zaxirasi orqali
# tarqalardi (`CLAUDE.md` 5-qoida — shaxsiy ma'lumot logga yozilmaydi).
#
# `access_log off` EMAS: sahifa qancha ochilgani, status kodi va javob hajmi kuzatuv
# uchun kerak — yo'qotiladigan yagona narsa query, u esa aynan ortiqcha qism.
#
# `$request` o'rniga `$safe_uri` — `location = /kirish` blokidagi `set` bilan yozilgan
# yo'l (query'siz). To'g'ridan-to'g'ri `$uri` YARAMAYDI: `try_files` uni `/index.html`
# ga o'zgartiradi, log esa so'rov tugagach yoziladi.
# Standart `main` formatidan YAGONA farqi — `$request` o'rniga query'siz yo'l; qolgan
# maydonlar (`$http_x_forwarded_for` ham) bir xil, ya'ni log tahlili buzilmaydi.
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $safe_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend — bir xil origin ostida, shuning uchun CORS kerak emas
    # va brauzer "mixed content" muammosiga tushmaydi.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Faqat Development muhitida ishlaydi: `Program.cs` Swagger'ni Production'da umuman
    # ro'yxatga olmaydi (`docs/08` 9-bo'lim), shu sabab standart `docker-compose.yml`
    # (`ASPNETCORE_ENVIRONMENT=Production`) ostida bu yo'l 404 qaytaradi. Blok lokal
    # `npm run generate:api` oqimi uchun saqlab qolindi.
    location /swagger {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Statik fayllar uzoq keshlanadi (nomida xesh bor), `index.html` esa keshlanmaydi —
    # aks holda foydalanuvchi eski versiyada qolib ketadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # --- Xavfsizlik sarlavhalari (`docs/08-auth-va-xavfsizlik.md` 7-bo'lim) ---
        # DIQQAT: nginx'da `add_header` MEROS OLINMAYDI — agar `location` blokining o'zida
        # bitta `add_header` bo'lsa, yuqori darajadagi (server) barcha `add_header`lar
        # BEKOR bo'ladi. Quyidagi ikkala `location`da ham `Cache-Control` qo'yiladi, shu
        # sabab sarlavhalar `server` darajasida emas, HAR BIR blokda takrorlangan.
        # `/api/`, `/swagger`, `/health` bloklariga qasddan qo'yilmagan — u yerdagi javoblarni
        # API'ning o'zi (`SecurityHeadersMiddleware`) o'z sarlavhalari bilan beradi va
        # takrorlanish (ayniqsa ikki xil CSP) yuzaga kelmaydi.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # `unsafe-eval` YO'Q (`prompts/31` cheklovi). `unsafe-inline` faqat STIL uchun kerak —
        # React `style={{...}}` atributlari va grafik kutubxonalari inline stil qo'yadi;
        # skriptlar uchun kerak emas (Vite build'i faqat tashqi `<script type="module">`
        # chiqaradi, `index.html`da inline skript yo'q — tekshirilgan).
        # Google Fonts (`index.html`) uchun `fonts.googleapis.com` (stil) va
        # `fonts.gstatic.com` (shrift fayllari) ochiq. `connect-src 'self'` yetarli: API
        # ayni origin ostida (`/api/` proksisi).
        #
        # TELEGRAM KIRISHI (`/kirish`) uchun ikkita aniq istisno:
        #   `script-src https://telegram.org`     — Login Widget skripti shu domendan yuklanadi
        #   `frame-src https://oauth.telegram.org` — widget aynan shu iframe'ni chizadi
        # Ular BUTUN sayt uchun ochiq, chunki bu SPA: foydalanuvchi `/kirish` ga klient
        # tomonda o'tsa, brauzer DASTLAB yuklangan sahifaning CSP'sini qo'llaydi — ya'ni
        # faqat `/kirish` uchun alohida `location` yozish ishlamaydi.
        # `connect-src` ga Telegram QO'SHILMADI: widget bergan ma'lumot bizning O'Z
        # API'mizga yuboriladi, brauzer Telegram'ga to'g'ridan-to'g'ri so'rov qilmaydi.
        # Imzo serverda HMAC-SHA256 bilan tekshiriladi, ya'ni iframe'ga ishonilmaydi.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://oauth.telegram.org" always;
    }

    # Telegram Login Widget `data-auth-url` bilan ishlaydi (`docs/08` §2a): foydalanuvchi
    # tasdiqlagach Telegram brauzerni AYNAN shu yo'lga, shaxsiy ma'lumotni query
    # parametrlarida olib qaytaradi. Blokning yagona vazifasi — o'sha query log'ga
    # tushmasligi (yuqoridagi `no_query` formati izohiga qarang). Klient tomonda sahifa
    # parametrlarni o'qib bo'lishi bilan `history.replaceState` ni chaqiradi, ya'ni ular
    # brauzer tarixida ham qolmaydi; server tomondagi log esa alohida yopiladi.
    #
    # `=` (aniq moslik) — faqat `/kirish` ning o'zi; `/kirish/...` ostidagi yo'llar yo'q.
    # Sarlavhalar `location /` dan MEROS OLINMAYDI (fayl boshidagi izoh), shu sabab bu
    # yerda ham to'liq takrorlangan.
    location = /kirish {
        # `try_files` `$uri` ni almashtirguncha yo'lni saqlab qolamiz (`set` rewrite
        # bosqichida, `try_files` dan oldin ishlaydi).
        set $safe_uri $uri;
        access_log /var/log/nginx/access.log no_query;

        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://oauth.telegram.org" always;

        # DIQQAT: bu yerda `try_files $uri /index.html;` YARAMAYDI. Oxirgi parametr fayl
        # yo'li bo'lsa nginx ICHKI REDIRECT qiladi, redirectdan keyin `location` QAYTA
        # tanlanadi (`/index.html` → `location /`) va log sozlamasi o'sha blokdan olinadi —
        # ya'ni `no_query` e'tiborsiz qolib, query yana `access.log` ga tushardi
        # (2026-09-06 da jonli tekshiruvda aynan shu aniqlandi).
        #
        # `/index.html` birinchi parametr, oxirgisi esa `=404`: fayl topilgani uchun u SHU
        # blok ichida beriladi, ichki redirect umuman bo'lmaydi.
        try_files /index.html =404;
    }

    # SPA: barcha noma'lum yo'llar `index.html` ga (client-side routing).
    location / {
        add_header Cache-Control "no-cache";
        # --- Xavfsizlik sarlavhalari — izoh uchun yuqoridagi `location /assets/` blokiga qarang
        # (nginx `add_header`ni meros qilmaydi, shu sabab ataylab takrorlangan).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://oauth.telegram.org" always;

        try_files $uri $uri/ /index.html;
    }
}
